<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Car Details</title>

    <style>
        body {
            font-family: serif;
            margin: 30px;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input,
        select,
        button {
            font-size: 14px;
            padding: 6px 8px;
        }

        button {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<h1>Car Details</h1>

<form method="post"
      th:action="@{'/update/' + ${car.id}}">

    <label>
        Brand:
        <input type="text"
               name="brand"
               th:value="${car.brand}"
               required>
    </label>

    <label>
        Model:
        <input type="text"
               name="model"
               th:value="${car.model}"
               required>
    </label>

    <label>
        Engine volume:
        <input type="number"
               step="0.1"
               name="engine_volume"
               th:value="${car.engineVolume}"
               required>
    </label>

    <label>
        Max speed:
        <input type="number"
               name="max_speed"
               th:value="${car.maxSpeed}"
               required>
    </label>

    <label>
        Country:

        <select name="country_id" required>

            <option th:each="country : ${countries}"
                    th:value="${country.id}"
                    th:text="${country.name}"
                    th:selected="${car.country != null and car.country.id == country.id}">
            </option>

        </select>

    </label>

    <button type="submit">
        Save changes
    </button>

</form>

<br>

<a href="/">
    ← Back to cars
</a>

</body>

</html>
